plugins { id 'com.android.application' }

// Release signing is provided by CI (or the local environment) via env vars:
//   KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
def ksPath = System.getenv('KEYSTORE_PATH')
def ksPass = System.getenv('KEYSTORE_PASSWORD')
def ksAlias = System.getenv('KEY_ALIAS')
def ksKeyPass = System.getenv('KEY_PASSWORD')
def hasSigning = ksPath && new File(ksPath).isFile() && ksPass && ksAlias && ksKeyPass

android {
    namespace 'com.tvpn.client'
    compileSdk 34
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'com.tvpn.client'
        minSdk 21
        targetSdk 23
        versionCode 4
        versionName '1.1.2'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }
    // 每个 ABI 单独出包（体积小、安装明确），另附一个通用包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }
    lint { abortOnError false }

    sourceSets {
        main {
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
