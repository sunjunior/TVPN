name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ABIS: "armeabi-v7a arm64-v8a"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.3.11579264"

      - name: Unpack vendored hev-socks5-tunnel
        run: bash scripts/fetch_deps.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash ./gradlew test --stacktrace

      # assembleDebug 会编译 JNI 层（relay 可执行文件 + hev-socks5-tunnel），每个 ABI 一份
      - name: Build debug (compiles native for every ABI)
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Stage relay executable into jniLibs source set
        run: |
          for abi in $ABIS; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp app/build/intermediates/cxx/Debug/*/obj/local/$abi/carvpnrelay \
               "app/src/main/jniLibs/$abi/libcarvpnrelay.so"
            echo "staged $abi: $(ls -l app/src/main/jniLibs/$abi/libcarvpnrelay.so | awk '{print $5}') bytes"
          done

      - name: Rebuild debug APKs to include relay
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Verify debug APKs contain relay for their ABI
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          for abi in $ABIS; do
            apk=$(ls app/build/outputs/apk/debug/app-$abi-debug.apk)
            unzip -l "$apk" | grep -q "lib/$abi/libcarvpnrelay.so" \
              && echo "OK $abi relay present" \
              || { echo "MISSING relay in $apk" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: tvpn-debug-apks
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APKs (signed, per-ABI + universal)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ./gradlew assembleRelease --stacktrace
          ls -l app/build/outputs/apk/release/

      - name: Verify release APKs (relay + signature)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for abi in $ABIS; do
            apk=app/build/outputs/apk/release/app-$abi-release.apk
            unzip -l "$apk" | grep -q "lib/$abi/libcarvpnrelay.so" \
              && echo "OK $abi relay present" \
              || { echo "MISSING relay in $apk" >&2; exit 1; }
            unzip -l "$apk" | grep -q "lib/$abi/libhev-socks5-tunnel.so" \
              && echo "OK $abi tunnel present" \
              || { echo "MISSING tunnel in $apk" >&2; exit 1; }
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | head -3
          done
          APK=app/build/outputs/apk/release/app-universal-release.apk
          unzip -l "$APK" | grep -q carvpnrelay
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -3

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk   "out/TVPN-${TAG}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "out/TVPN-${TAG}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk   "out/TVPN-${TAG}-universal.apk"
          ls -l out/
          NOTES=$(cat <<'EOF'
          按应用白名单的轻量级横屏 VPN 客户端（Android 5.0+，targetSdk 23）。

          本页提供三种安装包，按设备架构选择：

          - `TVPN-<TAG>-arm64-v8a.apk`：64 位 ARM 设备（Android 5.0+，主流电视盒子 / 平板 / 车机）
          - `TVPN-<TAG>-armeabi-v7a.apk`：32 位 ARM 设备（老车机、老盒子）
          - `TVPN-<TAG>-universal.apk`：两种架构都包含，不确定架构时用它

          功能：订阅导入（Clash，仅 `type: http`，支持 `tls: true`）、多节点管理 + 自动选最快节点、
          按应用白名单、出口网络自适应（WiFi → 以太网 → 蜂窝）、故障切换、开机自启、TLS 上游适配器、
          隧道内 DNS（UDP/53 经代理的 CONNECT 转成 DNS-over-TCP 转发，带污染检测与多解析器回退）。

          注意：除 DNS 外不转发 UDP；同一签名升级请勿混装不同签名包；开源许可 GPLv3。
          本包由 GitHub Actions 从标签 `<TAG>` 自动构建并使用 release 密钥签名。
          EOF
          )
          NOTES="${NOTES//<TAG>/$TAG}"
          gh release create "$TAG" out/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TVPN ${TAG}" \
            --notes "$NOTES" \
          || gh release upload "$TAG" out/*.apk --clobber --repo "${GITHUB_REPOSITORY}"
